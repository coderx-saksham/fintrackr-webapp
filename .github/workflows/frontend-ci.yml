name: Frontend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (catches broken builds before Vercel does)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

# NOTE: Vercel deploys automatically on every push to main once you connect
# the repo in the Vercel dashboard (Project -> Git). No deploy step needed
# here — this workflow's job is to fail fast in the GitHub Actions tab if
# something is broken, before Vercel even attempts its own build.