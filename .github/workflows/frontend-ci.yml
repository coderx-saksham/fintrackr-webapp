name: Frontend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (warnings only, does not block build)
        run: npm run lint || true

      - name: Build (catches broken builds before Vercel does)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}